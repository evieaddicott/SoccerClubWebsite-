<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Lamorinda Soccer Club - Join the Team</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://fonts.googleapis.com/css2?family=Cookie&display=swap" rel="stylesheet">
   <style>
      body {
        background-color: black;
        margin: 0;
        font-family: Arial, sans-serif;
        color: #2d2d2d;
      }

      .heading {
        font-family: 'Cookie', cursive;
        font-size: 3.5rem;
        background-color: #ccff00 !important;
        text-align: center;
        letter-spacing: 0.05em;
        margin: 30px auto;
        padding: 15px;
        border-radius: 12px;
      }

      .card {
        background-color: #ccff00 !important;
        border: 2px dotted #e28888 !important;
        border-radius: 12px;
        padding: 30px;
        margin: 0 auto;
      }

      .navbar {
        background-color: #ccff00 !important;
        padding: 15px !important;
      }
   </style>
</head>
<body>

   <nav class="navbar navbar-expand-lg mb-4">
     <div class="container-fluid">
       <a class="navbar-brand fw-bold" href="index.html">LaMo</a>
       <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
         <span class="navbar-toggler-icon"></span>
       </button>
       <div class="collapse navbar-collapse" id="navbarSupportedContent">
         <ul class="navbar-nav me-auto mb-2 mb-lg-0">
           <li class="nav-item">
             <a class="nav-link" href="index.html">Home</a>
           </li>
           <li class="nav-item">
             <a class="nav-link" href="about.html">About</a>
           </li>
           <li class="nav-item">
             <a class="nav-link active" aria-current="page" href="join.html">Join the Team</a>
           </li>
         </ul>
       </div>
     </div>
   </nav>

   <div class="container">
      <div class="row justify-content-center">
          <div class="col-md-8">
              <h1 class="heading">Player Interest Form</h1>
          </div>
      </div>

      <div class="row justify-content-center mb-5">
          <div class="col-md-8">
              <div class="card shadow-sm">
                  <form onsubmit="event.preventDefault(); window.location.href='join.html';">
                     
                     <div class="row mb-3">
                       <label for="playerName" class="col-sm-4 col-form-label fw-bold text-start">Player Full Name</label>
                       <div class="col-sm-8">
                         <input type="text" class="form-control" id="playerName" placeholder="First and Last Name" required>
                       </div>
                     </div>

                     <div class="row mb-3">
                       <label for="gradYear" class="col-sm-4 col-form-label fw-bold text-start">Birth Year / Grad Year</label>
                       <div class="col-sm-8">
                         <input type="text" class="form-control" id="gradYear" placeholder="e.g. 2009 / Class of 2027" required>
                       </div>
                     </div>

                     <div class="row mb-3">
                       <label for="inputEmail" class="col-sm-4 col-form-label fw-bold text-start">Player / Parent Email</label>
                       <div class="col-sm-8">
                         <input type="email" class="form-control" id="inputEmail" placeholder="name@example.com" required>
                       </div>
                     </div>

                     <div class="row mb-3">
                       <label for="phoneNumber" class="col-sm-4 col-form-label fw-bold text-start">Phone Number</label>
                       <div class="col-sm-8">
                         <input type="tel" class="form-control" id="phoneNumber" placeholder="(555) 123-4567" required>
                       </div>
                     </div>

                     <div class="row mb-3">
                       <label for="positionSelect" class="col-sm-4 col-form-label fw-bold text-start">Primary Position</label>
                       <div class="col-sm-8">
                         <select class="form-select" id="positionSelect" required>
                           <option value="" selected disabled>Choose a position...</option>
                           <option value="forward">Forward / Striker</option>
                           <option value="midfielder">Midfielder</option>
                           <option value="defender">Defender</option>
                           <option value="goalkeeper">Goalkeeper</option>
                         </select>
                       </div>
                     </div>

                     <div class="row mb-3">
                       <label for="clubLevelSelect" class="col-sm-4 col-form-label fw-bold text-start">Previous Club Level</label>
                       <div class="col-sm-8">
                         <select class="form-select" id="clubLevelSelect" required>
                           <option value="" selected disabled>Select highest level played...</option>
                           <option value="ECNL">ECNL</option>
                           <option value="ECNL-RL">ECNL-RL</option>
                           <option value="NPL">NPL</option>
                           <option value="GA">GA (Girls Academy)</option>
                           <option value="GA-Aspire">GA - Aspire</option>
                           <option value="MLS-next">MLS-next</option>
                           <option value="Other">Other</option>
                         </select>
                       </div>
                     </div>

                     <div class="row mb-3">
                       <label for="previousClub" class="col-sm-4 col-form-label fw-bold text-start">Current / Previous Club</label>
                       <div class="col-sm-8">
                         <input type="text" class="form-control" id="previousClub" placeholder="Club name (or 'None')">
                       </div>
                     </div>

                     <div class="row mb-3">
                       <label for="additionalNotes" class="col-sm-4 col-form-label fw-bold text-start">Additional Info</label>
                       <div class="col-sm-8">
                         <textarea class="form-control" id="additionalNotes" rows="3" placeholder="Secondary positions, dominant foot, highlights link, etc."></textarea>
                       </div>
                     </div>


                     <div class="row mb-4">
                       <div class="col-sm-8 offset-sm-4 text-start">
                         <div class="form-check">
                           <input class="form-check-input" type="checkbox" id="gridCheck1" required>
                           <label class="form-check-label" for="gridCheck1">
                             I confirm the info above is accurate and want to be contacted for tryouts.
                           </label>
                         </div>
                       </div>
                     </div>

                     <div class="text-center">
                         <button type="submit" class="btn btn-dark btn-lg px-5">Submit Interest</button>
                     </div>

                   </form>
              </div>
          </div>
      </div>
   </div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
